name: AAGMAN quality gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'aagman-app/**'
      - '.github/workflows/quality-gates.yml'
  push:
    branches: [main]
    paths:
      - 'aagman-app/**'
      - '.github/workflows/quality-gates.yml'

permissions:
  contents: read

jobs:
  build-and-browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aagman-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aagman-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production app
        run: npm run build
      - name: Run browser regression suite
        run: npm run test:e2e
